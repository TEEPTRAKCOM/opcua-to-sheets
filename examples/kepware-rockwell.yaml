# Rockwell ControlLogix / CompactLogix read through an OPC UA server such as KEPServerEX.
# Kepware tags usually look like ns=2;s=Channel.Device.Tag. Confirm with browse.
sampleSeconds: 10
flushSeconds: 30
sheet:
  spreadsheetId: "PASTE-THE-ID"
  credentials: "./service-account.json"
machines:
  - name: "Molding 3 - Logix"
    endpoint: "opc.tcp://192.168.0.30:49320"
    tags:
      - { name: "Running",     nodeId: "ns=2;s=Logix.Molding3.Running" }
      - { name: "PartCounter", nodeId: "ns=2;s=Logix.Molding3.PartCount" }
