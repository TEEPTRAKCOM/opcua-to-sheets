# Siemens S7-1500 with the built-in OPC UA server enabled in TIA Portal.
# Data block tags usually look like ns=3;s="DB name"."Tag name". Confirm with: opcua-to-sheets browse opc.tcp://<plc-ip>:4840
sampleSeconds: 10
flushSeconds: 30
sheet:
  spreadsheetId: "PASTE-THE-ID"
  credentials: "./service-account.json"
machines:
  - name: "Line 1 - S7-1500"
    endpoint: "opc.tcp://192.168.0.1:4840"
    user: "reader"
    password: "${OPCUA_PASSWORD}"
    security: { mode: SignAndEncrypt, policy: Basic256Sha256 }
    tags:
      - { name: "Running",     nodeId: "ns=3;s=\"DB_OEE\".\"Running\"" }
      - { name: "PartCounter", nodeId: "ns=3;s=\"DB_OEE\".\"PartCounter\"" }
      - { name: "Fault",       nodeId: "ns=3;s=\"DB_OEE\".\"FaultCode\"" }
