# Beckhoff TwinCAT 3 with the TF6100 OPC UA server.
# Symbols usually look like ns=4;s=MAIN.nPartCount (the namespace index can differ). Confirm with browse.
sampleSeconds: 10
flushSeconds: 30
sheet:
  spreadsheetId: "PASTE-THE-ID"
  credentials: "./service-account.json"
machines:
  - name: "Packer 2 - TwinCAT"
    endpoint: "opc.tcp://192.168.0.20:4840"
    tags:
      - { name: "Running",     nodeId: "ns=4;s=MAIN.bRunning" }
      - { name: "PartCounter", nodeId: "ns=4;s=MAIN.nPartCount" }
